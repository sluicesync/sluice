# Release workflow.
#
# Triggered when a tag matching v* is pushed. Builds cross-platform
# binaries via GoReleaser (configured in .goreleaser.yaml) and publishes
# a draft GitHub release with the binaries attached.
#
# To cut a release locally:
#   git tag v0.1.0
#   git push origin v0.1.0
# GitHub Actions takes it from there.
#
# The release is created as a draft so you can review the changelog and
# binaries before clicking "Publish release" on GitHub.

name: Release

on:
  push:
    tags:
      - "v*"

# This workflow needs to write to the repository (creating releases and
# uploading assets) and to GHCR (pushing the runtime container image), so
# we opt in explicitly. Other tokens stay read-only.
permissions:
  contents: write
  packages: write
  # Build provenance (audit 2026-08-04). id-token lets the runner mint the
  # short-lived OIDC token Sigstore signs against; attestations lets it record
  # the result. Both are scoped to this workflow run and neither can push code.
  #
  # Why provenance matters here specifically: sluice is the tool that MAKES the
  # backups whose manifests it signs, so a substituted binary defeats canon-v5
  # upstream of every guarantee SECURITY.md reasons about. Before this, the
  # integrity chain bottomed out at "trust GitHub's release storage" —
  # checksums.txt authenticates the binaries and nothing authenticated
  # checksums.txt.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Explicit cap so a wedged step can't run to GitHub's 6-hour
    # default — that failure mode silently stalls the autonomous
    # release flow, which watches this workflow for completion.
    # A full release build (cross-platform binaries + multi-arch
    # image) takes ~10-15m.
    timeout-minutes: 30
    steps:
      # Every action below is pinned to a full commit SHA (with the
      # tracking tag in a trailing comment): this workflow runs with
      # contents:write + packages:write + TAP_GITHUB_TOKEN, so a
      # re-pointed mutable tag on any of these actions would mean
      # arbitrary code with release-signing/publish privileges
      # (poisoned binaries, images, tap formulae). Dependabot's
      # github-actions ecosystem updates SHA pins automatically.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # GoReleaser uses git history for the changelog. fetch-depth: 0
          # tells the checkout action to clone the full history, not just
          # the latest commit.
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          # Reads the version from go.mod so CI tracks the declared
          # toolchain automatically.
          go-version-file: "go.mod"

      # QEMU + buildx so GoReleaser can build the linux/arm64 runtime
      # image alongside amd64 (the Dockerfile only COPYs the pre-built
      # binary, so this is a trivial cross-build, not an emulated compile).
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Authenticate to GHCR so GoReleaser can push the container image.
      # GITHUB_TOKEN has packages:write (per the permissions block above).
      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The GoReleaser action runs the release process defined in
      # .goreleaser.yaml. GITHUB_TOKEN is automatically provided by
      # GitHub Actions and has permission (per the `permissions` block
      # above) to create releases on this repo.
      #
      # The GoReleaser VERSION is pinned too (was `latest`): two builds
      # of the same tag must not differ because the tool under them
      # changed. Dependabot doesn't bump this one — revisit on majors.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo token for the brews / scoops / winget pipes, which
          # commit a formula/manifest into sluicesync/{homebrew-tap,
          # scoop-bucket, winget-pkgs}. The default GITHUB_TOKEN can't push to
          # other repos. Fine-grained PAT, contents:write on those three repos.
          # Renders empty until the secret exists; brews/scoops/winget then
          # fail at release time, so don't tag a release until it's set.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # Build provenance (audit 2026-08-04; image coverage added for C-12).
      #
      # DELIBERATELY SEPARATE STEPS, not goreleaser's own `signs:` block. The
      # binaries, checksums and GHCR image are already uploaded by the time
      # these run, so a failure here leaves the draft intact and is fixed by
      # re-running one job — no tag force-move, no duplicate draft. That shape
      # is chosen because the tap publishers have already failed a release
      # once, AFTER upload, for an expired token; adding provenance inside
      # goreleaser would put a second such failure on the same critical path.
      #
      # These steps are NOT one of the six publish gates. They are additive
      # provenance; a release whose attestation failed is still a valid
      # release, and gating publication on it would trade a real property
      # (working binaries) for a newer one.
      #
      # WHAT IS COVERED AND WHAT IS NOT — the roster, because the previous
      # wording here was the defect. It said the attestation covered
      # "everything a consumer downloads", which was false of the single
      # artifact people actually run in production: the GHCR image was not a
      # subject, so `gh attestation verify oci://ghcr.io/sluicesync/sluice:X`
      # returned HTTP 404 while the tarball verified green — a narrowed
      # security claim, which is worse than an absent one because it stops
      # anyone from looking. `TestEveryPublishedReleaseArtifactIsAttestedOrExempt`
      # (internal/docsync) now fails the build when .goreleaser.yaml grows a
      # publishing surface this roster does not name.
      #
      #   ATTESTED
      #     archives         dist/*.tar.gz, dist/*.zip
      #     native packages  dist/*.deb, dist/*.rpm, dist/*.apk
      #     checksums.txt    the important one — it authenticates the binaries
      #                      and nothing authenticated it before v0.110.1
      #     GHCR image       the multi-arch OCI index behind :<ver> and
      #                      :latest (ONE digest: both tags name identical
      #                      index bytes, and a manifest list does not contain
      #                      its own tag) AND both per-arch manifests, because
      #                      :<ver>-amd64 / :<ver>-arm64 are published,
      #                      pullable tags with digests of their own — an
      #                      attestation on the index does not cover them.
      #
      #   NOT ATTESTED, each with its reason
      #     homebrew formula, scoop manifest — git commits in sibling repos,
      #       not build outputs of this run. Each is a download URL plus the
      #       sha256 of an archive that IS attested, so a consumer's
      #       verification routes through the archive; the control on the
      #       commit itself is TAP_GITHUB_TOKEN's repo scope.
      #     winget manifest — `skip_upload: "true"` in .goreleaser.yaml: it is
      #       generated into dist/winget/ and never published by this workflow.
      #     GitHub's auto "Source code (zip/tar.gz)" — produced by GitHub from
      #       the tag, never present in dist/, so this job has nothing to hash.
      #       Its integrity control is the commit SHA the tag names.
      #     dist/digests.txt, dist/metadata.json, dist/artifacts.json — build
      #       metadata, not release assets. Confirmed against a real release
      #       rather than inferred: v0.116.1's published asset list is exactly
      #       the 13 files the globs below match, and none of these three.
      #
      # Consumers verify with:
      #   gh attestation verify sluice_<ver>_Linux_x86_64.tar.gz \
      #     --repo sluicesync/sluice
      #   gh attestation verify oci://ghcr.io/sluicesync/sluice:<ver> \
      #     --repo sluicesync/sluice
      # ----------------------------------------------------------------------
      - name: Attest build provenance (release assets)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt

      # The digests come from GoReleaser's OWN artifact metadata, never from a
      # re-inspection of the registry: re-resolving `:<ver>` after the push
      # would attest whatever that tag points at NOW, which is a different
      # question from "what did this run build and push". `.extra.Digest` is
      # what the push itself reported.
      #
      # WHICH digest matters, because attesting the wrong one yields a
      # verification that passes for something nobody pulls. A multi-arch tag
      # resolves to an OCI INDEX, and the index digest is what
      # `gh attestation verify oci://…:<tag>` looks up — ground-truthed against
      # the live v0.116.1 image, where `docker buildx imagetools inspect`
      # reports index sha256:85a93ac3…, and that is precisely the digest gh
      # queried (and 404'd on). So the index is attested for the tags people
      # pull, and the two per-arch manifests are attested separately for the
      # tags a single-arch pin uses; the index is NOT assumed to cover them.
      - name: Resolve the published GHCR image digests
        id: image
        run: |
          set -euo pipefail
          image=ghcr.io/sluicesync/sluice
          version=$(jq -r '.version' dist/metadata.json)

          # A missing digest FAILS the job rather than attesting nothing. An
          # image-template rename in .goreleaser.yaml would otherwise leave
          # the image silently unattested — which is the exact defect these
          # steps exist to close, so it must not be reachable by accident.
          digest_of() {
            local kind=$1 ref=$2
            local d
            d=$(jq -r --arg kind "$kind" --arg ref "$ref" \
              '[.[] | select(.type == $kind and .name == $ref) | .extra.Digest] | unique | .[0] // ""' \
              dist/artifacts.json)
            if ! printf '%s' "$d" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              printf 'no %s digest for %s in dist/artifacts.json (got %q). The image names in .goreleaser.yaml and this step have drifted; the released image would ship UNATTESTED.\n' \
                "$kind" "$ref" "$d" >&2
              return 1
            fi
            printf '%s' "$d"
          }

          # Plain assignments so `set -e` aborts on a failing digest_of: inside
          # `echo "$(digest_of …)"` the non-zero status is the substitution's,
          # not echo's, and would be swallowed.
          index=$(digest_of 'Docker Manifest' "$image:$version")
          amd64=$(digest_of 'Published Docker Image' "$image:$version-amd64")
          arm64=$(digest_of 'Published Docker Image' "$image:$version-arm64")

          {
            echo "index=$index"
            echo "amd64=$amd64"
            echo "arm64=$arm64"
          } >> "$GITHUB_OUTPUT"

      # push-to-registry stores the attestation as an OCI referrer alongside
      # the image, so it travels with a mirrored copy instead of living only
      # in GitHub's attestations API. `gh attestation verify --repo` reads the
      # API either way; the referrer is what non-gh tooling (cosign, oras) can
      # find.
      - name: Attest build provenance (GHCR image, multi-arch index)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/sluicesync/sluice
          subject-digest: ${{ steps.image.outputs.index }}
          push-to-registry: true

      - name: Attest build provenance (GHCR image, linux/amd64)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/sluicesync/sluice
          subject-digest: ${{ steps.image.outputs.amd64 }}
          push-to-registry: true

      - name: Attest build provenance (GHCR image, linux/arm64)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/sluicesync/sluice
          subject-digest: ${{ steps.image.outputs.arm64 }}
          push-to-registry: true

# Scheduled generative-fuzz run for the migrate round-trip harness.
#
# The in-tree fuzz harness (internal/pipeline/
# migrate_fuzz_roundtrip_integration_test.go) runs inside the normal
# integration suite at a tiny deterministic smoke budget (fixed seed,
# 4 cases per direction — the PG/MySQL four plus the SQLite
# source/target four, see allDirections()) so every PR exercises the
# *harness*. That fixed seed means PR CI replays the same ~32 cases
# forever — the
# generator's whole point (catching the Bug-74-style next-family-over
# defect the hand-written matrix missed) needs case DIVERSITY, which
# is what this job adds: a weekly run at a couple hundred cases per
# direction with a fresh seed every time (the run id), plus a
# workflow_dispatch for pre-release deep runs.
#
# On failure the harness dumps each failing case as a deterministically
# replayable fixture (seed + case index + direction reproduce the DDL
# byte-for-byte); this job uploads those as an artifact, and the seed
# is in the job log — so a red run here is fully reproducible locally:
#   SLUICE_FUZZ_SEED=<seed> SLUICE_FUZZ_ITERS=<iters> \
#     go test -tags=integration -run '^TestMigrate_FuzzRoundtrip$' ./internal/pipeline/
#
# Saturday 07:00 UTC: clear of the Sunday 06:00 prebake and the Sunday
# 08:00 Vitess version matrix, so the scheduled jobs never contend for
# runners.

name: Fuzz roundtrip

on:
  schedule:
    - cron: "0 7 * * 6"
  workflow_dispatch:
    inputs:
      iters:
        description: "Cases per direction (SLUICE_FUZZ_ITERS)"
        required: false
        default: "200"
      seed:
        description: "Master seed (SLUICE_FUZZ_SEED); empty = this run's id"
        required: false
        default: ""
      codecFuzztime:
        description: "Per-target -fuzztime for the codec differential fuzzers"
        required: false
        default: "20m"

permissions:
  contents: read
  packages: read

jobs:
  fuzz:
    name: Fuzz roundtrip
    runs-on: ubuntu-latest
    # 200 cases × 8 directions on real containers under -race needs a
    # generous envelope (the 4 SQLite directions are lighter — one
    # container each, scalar-only sources — but still real migrates);
    # the inner go-test timeout stays below it so Go's diagnostic
    # timeout-panic fires before a hard job kill.
    timeout-minutes: 300
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: "go.mod"
      - run: go mod download

      # Same pre-baked images + bounded-retry pull as the main
      # integration shards (see ci.yml for the rationale).
      - name: Log in to ghcr.io + pre-pull pre-baked images (bounded retry)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci-ghcr-pull.sh \
            ghcr.io/sluicesync/sluice-mysql:8.0-prebaked \
            ghcr.io/sluicesync/sluice-postgres:16-prebaked

      - name: Run the fuzz harness (fresh seed, deep budget)
        env:
          # A fresh seed per scheduled run is the whole point — the
          # run id is unique, monotonic, and recorded with the run.
          SLUICE_FUZZ_SEED: ${{ github.event.inputs.seed || github.run_id }}
          SLUICE_FUZZ_ITERS: ${{ github.event.inputs.iters || '200' }}
        run: |
          echo "fuzz: seed=$SLUICE_FUZZ_SEED iters/dir=$SLUICE_FUZZ_ITERS"
          set -o pipefail
          go test -tags=integration -race -count=1 -timeout=290m \
            -run '^TestMigrate_FuzzRoundtrip$' -v ./internal/pipeline/ 2>&1 | tee fuzz.out
          # CI-1 (audit 2026-08-17) non-vacuity guard: `go test -run` exits 0
          # when the anchored name matches nothing, so a rename of this
          # scheduled silent-loss catcher would green on zero iterations.
          # Assert the harness actually ran AND passed.
          grep -q '^--- PASS: TestMigrate_FuzzRoundtrip' fuzz.out || {
            echo "::error::fuzz-roundtrip: TestMigrate_FuzzRoundtrip did not run+PASS (vacuous green — a rename or skip). See the run log."
            exit 1
          }

      # Each failing case is dumped as a replayable fixture; keep them.
      - name: Upload failure fixtures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures-seed-${{ github.event.inputs.seed || github.run_id }}
          path: internal/pipeline/testdata/fuzz-failures/
          if-no-files-found: ignore

  # Go-native differential fuzz of the fast chunk row codec
  # (backup_chunk_fast.go, tasks #51/#52). The two targets assert the
  # fast encoder/decoder is equivalent to the legacy reflection path —
  # byte-identical encode output, decode-or-bail vs the legacy oracle —
  # on generated rows and on arbitrary line bytes. PR CI only replays
  # their seed corpus; this job is where new inputs get explored. No
  # Docker, no build tags, no -race (the codec is single-goroutine by
  # construction; raw throughput explores more inputs per minute).
  # A crasher is written to internal/pipeline/testdata/fuzz/<target>/
  # and uploaded — committing that file to the repo pins the regression.
  codec-fuzz:
    name: Codec differential fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: "go.mod"
      - run: go mod download

      - name: Fuzz encode differential
        env:
          FUZZTIME: ${{ github.event.inputs.codecFuzztime || '20m' }}
          # audit T-1: the FuzzFastRow* targets moved to internal/pipeline/
          # blobcodec (e051de13) but this leg still fuzzed the non-recursive
          # ./internal/pipeline/, where `go test -fuzz` matched ZERO targets,
          # warned, and exited 0 — the codec differential fuzz was inert for
          # weeks. Point it at the package that holds them.
          PKG: ./internal/pipeline/blobcodec/
        run: |
          set -o pipefail
          # Target-exists guard (audit T-1, anti-vacuous-green): `go test
          # -fuzz` greens on a zero-match, so a rename/move of this target
          # would silently re-inert the fuzz. Assert the target is present
          # before spending fuzztime on it.
          #
          # Capture the listing, THEN match it — do NOT `go test -list … |
          # grep -q …`. `go test -list` prints the matching name AND a
          # trailing `ok <pkg> <time>` line; `grep -q` exits on the first
          # match and closes the pipe, so on Linux `go test` is killed by
          # SIGPIPE writing that trailer and, under `set -o pipefail`, the
          # pipeline reports failure — a false "target not found" that fired
          # only in CI (Linux), never locally (Windows has no SIGPIPE kill).
          # That was the standing red on this leg; the herestring match has
          # no live-process pipe to break.
          listing="$(go test -list '^FuzzFastRowEncodeDifferential$' "$PKG")"
          grep -qx 'FuzzFastRowEncodeDifferential' <<<"$listing" || {
            echo "::error::fuzz: FuzzFastRowEncodeDifferential not found in $PKG — target moved/renamed; the fuzz leg would run empty (audit T-1)."
            exit 1
          }
          go test -run NoMatch -fuzz '^FuzzFastRowEncodeDifferential$' \
            -fuzztime "$FUZZTIME" "$PKG"

      - name: Fuzz decode differential
        # Run even if the encode fuzzer found something — the two
        # targets cover independent directions.
        if: success() || failure()
        env:
          FUZZTIME: ${{ github.event.inputs.codecFuzztime || '20m' }}
          PKG: ./internal/pipeline/blobcodec/
        run: |
          set -o pipefail
          # Capture-then-match, not `… | grep -q` — see the encode leg's
          # comment: the pipe form false-fails on Linux via SIGPIPE on
          # `go test -list`'s trailing `ok` line under `set -o pipefail`.
          listing="$(go test -list '^FuzzFastRowDecodeDifferential$' "$PKG")"
          grep -qx 'FuzzFastRowDecodeDifferential' <<<"$listing" || {
            echo "::error::fuzz: FuzzFastRowDecodeDifferential not found in $PKG — target moved/renamed (audit T-1)."
            exit 1
          }
          go test -run NoMatch -fuzz '^FuzzFastRowDecodeDifferential$' \
            -fuzztime "$FUZZTIME" "$PKG"

      - name: Upload crasher corpus
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: codec-fuzz-crashers-${{ github.run_id }}
          path: internal/pipeline/blobcodec/testdata/fuzz/
          if-no-files-found: ignore

# Scheduled run for the heavy, previously-orphaned test suites
# (repo-audit M0.5): the Vitess chaos pair and the Vitess reshard
# correctness test. Until 2026-06-10 these suites had NO CI entry
# point at all — they only ran when someone remembered to run them
# locally (their build tags are at least type-checked on every PR by
# the Lint job's vet-tags matrix, but type-checking is not running).
#
# Cadence: weekly, Sunday 10:00 UTC — after the 06:00 prebake refresh
# and the 08:00 Vitess version matrix, so the GHCR mirrors are fresh
# and the runner pool isn't contended. Plus workflow_dispatch for
# on-demand runs (pre-release validation of VStream-path changes).
# Owner: the release operator; a red run here files a bug, it never
# blocks a merge (NOT a required check — each leg boots real
# multi-process Vitess clusters and runs fault injection, far too
# heavy and too stateful for the per-PR gate).
#
# The `ddlfixture` leg (repo-audit 2026-07-03 T-5) is DISPATCH-ONLY —
# it is excluded from the weekly schedule on purpose: the Dolt
# sqllogictest corpus harness is a fixture sweep, not a regression
# suite; run it on demand before/after schema-reader changes.
#
# The `corpus` leg (roadmap item 52) runs the real-world OSS-schema
# corpus on the weekly schedule (fetch-on-demand dumps + the item-51
# restore-parity oracle + sample-row verify over those schemas). It also
# compiles in the per-PR pipeline-migrate shard, but SKIPs there because
# the dumps are gitignored — this leg fetches them and is where they run.
#
# The `crossversion` leg (roadmap item 90 / Bug 212) is the only place in
# CI where TWO sluice binaries meet ONE backup store. Every other suite in
# this repo runs one binary against its own output, which is precisely why
# a v0.104.0 binary extending a v0.103.2 chain — raising the chain's format
# version and thereby making the WHOLE chain unrestorable by v0.103.2,
# including the segments v0.103.2 wrote itself — shipped silently and was
# found by a post-release regression cycle instead. On the WEEKLY schedule,
# not dispatch-only (contrast `ddlfixture`): it is a regression signal
# rather than a fixture sweep, it is cheap (~15m; two `go build`s and one
# PG container), and the defect class is introduced by ORDINARY commits —
# a format-version bump is a small, innocuous-looking diff, so the gate has
# to be standing when one lands rather than waiting to be remembered.
# ALSO dispatch it by hand before tagging any release that bumps
# BackupFormatVersion; weekly is the backstop, not the release gate.
#
# The `kmsverify` leg (audit N-17c) runs the AWS-KMS backup/restore
# suite against a real localstack KMS container. It sat here as a
# documented deliberate skip while every test body was t.Skip()
# scaffolding (scheduling it would have run five skips and reported
# green — the vacuous-pass failure mode); the scaffolding is now
# wired (round-trip, chain extension, wrong-key + missing-key
# refusals run for real; only the IAM access-denied case remains a
# skip, since localstack community edition doesn't enforce IAM).

name: Extended suites

on:
  schedule:
    - cron: "0 10 * * 0"
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        required: false
        default: "all"
        type: choice
        options: [all, chaos, reshard, noblob, vstream-pipeline, corpus, ddlfixture, kmsverify, crossversion]

permissions:
  contents: read
  packages: read

concurrency:
  group: extended-suites-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The chaos suite: primary failover (PRS + ERS), tablet kill mid
  # cold-start, vtgate restart mid-sync, rolling upgrade mid-sync, plus
  # the Bug-146 purged-GTID proactive pre-flight pin — all against the
  # real compose cluster
  # (internal/engines/mysql/testdata/vitesscluster/docker-compose.yml).
  # Every chaos-tagged test MUST carry the TestVitessChaos_ prefix or
  # the -run filter below silently skips it (enforced by
  # scripts/check-run-filter-coverage.sh in ci.yml's Lint job).
  chaos:
    name: Vitess chaos suite
    if: ${{ github.event_name == 'schedule' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'chaos' }}
    runs-on: ubuntu-latest
    # -race roughly halves throughput on the CPU-bound stretches
    # (repo-audit 2026-07-03 item 0.4 added it to this leg; the
    # vstream-pipeline leg had it from day one), so the pre-race
    # budgets (80m inner / 90 outer) are bumped ~1.5x. Inner stays
    # < outer so Go's diagnostic timeout-panic fires before the
    # hard job kill.
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      # The compose file defaults to vitess/lite:v24.0.1; point it at
      # the pre-baked GHCR mirror instead (no docker.io rate-limit
      # SPOF, same image bytes — build-prebaked-images.yml publishes a
      # pure retag).
      - name: Log in to ghcr.io + pull the pre-baked Vitess image
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-ghcr-pull.sh ghcr.io/sluicesync/sluice-vitess:v24.0.1

      # TestVitessChaos_RollingUpgrade_MidSync HARDCODES the literal
      # docker.io tags vitess/lite:v24.0.0 (initial boot) and
      # vitess/lite:v24.0.1 (mid-sync recreate) via
      # chaosUpgrade{From,To}Image, overriding VITESS_LITE_IMAGE. Without
      # this, both cold-pull from docker.io during the live per-service
      # recreate — and the recreate competes with a 5m PingTablet budget,
      # so a slow cold pull times the tablet-ping out (the ~2026-07-12
      # intermittent red). Warm BOTH into the local cache up front, off the
      # ping-budget path: v24.0.1 retags from its GHCR mirror; v24.0.0 has
      # no mirror (kept out of vitess-versions.txt by the one-minor-per-
      # major convention) so ci-mirror-pull falls back to a docker.io pull
      # here in this dedicated step (full retry budget, not the ping timer).
      - name: Warm the rolling-upgrade image cache (v24.0.0 + v24.0.1)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci-mirror-pull.sh --mirror ghcr.io/sluicesync/sluice-vitess:v24.0.1 vitess/lite:v24.0.1
          bash scripts/ci-mirror-pull.sh --mirror ghcr.io/sluicesync/sluice-vitess:v24.0.0 vitess/lite:v24.0.0

      - name: Run the chaos suite
        env:
          VITESS_LITE_IMAGE: ghcr.io/sluicesync/sluice-vitess:v24.0.1
        run: |
          # H-6 non-vacuity guard: 7 selected, 6 PASS — the 7th
          # (TestVitessChaos_RollingUpgrade_MidSync) is an unconditional
          # roadmap-tracked quarantine t.Skip. A cluster-boot infra skip on any
          # of the other 6 (the failure mode this leg exists to catch) drops the
          # PASS count and fails loud instead of greening vacuously.
          #
          # Went 5→7 in v0.147.1 with two lineage tests that cover what this
          # suite structurally could not: every pre-existing chaos test calls
          # StreamChanges ONCE, before its fault, and Reopen does not re-run the
          # resume pre-flight — so the suite could not exercise the pre-flight
          # after a reparent at all, and its clean result on that question was
          # nearly vacuous. TestVitessChaos_LineagePreflight_AcrossReparents and
          # TestVitessChaos_ErrantGTID_PositionAndLineage ask it directly.
          #
          # A third probe from the same investigation is deliberately NOT here.
          # It bypassed the production pre-flight to measure what resuming
          # WOULD do, so it exercises a path production cannot reach — an
          # experiment, not a gate. Hanging this leg's greenness on non-product
          # code inverts what the leg is for; its evidence lives in
          # docs/dev/audit-backlog.md and commit f4807c2d.
          bash scripts/check-leg-nonvacuity.sh \
            'integration vitesscluster chaos' '^TestVitessChaos_' ./internal/engines/mysql/... 7 6 \
            -race -timeout=120m

  # The reshard correctness test: proves the CDC reader follows a
  # VReplication reshard (shard split) without loss or duplication.
  # Its own in-test comments flag any failure as "a sluice CDC-reader
  # correctness bug, NOT a flake" — treat a red leg here as a real
  # bug to file, not a rerun candidate.
  reshard:
    name: Vitess reshard correctness
    if: ${{ github.event_name == 'schedule' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'reshard' }}
    runs-on: ubuntu-latest
    # Budgets bumped ~1.5x from the pre-race 65m/75 for the -race
    # overhead (repo-audit 2026-07-03 item 0.4); inner < outer as above.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      # The reshard harness hardcodes vitess/lite:latest (vrVitessImage in
      # vitess_cluster_reshard_integration_test.go), so whatever we pull has to
      # end up under that local name. We pull a PINNED DIGEST and retag it.
      #
      # PINNED 2026-09-20, and this leg is the reason the pin exists. It was the
      # ONLY leg riding a floating tag — every other leg in this workflow pins
      # v24.0.1 — and sluice-vitess:latest is republished by the Sunday 06:00 UTC
      # prebake (build-prebaked-images.yml) a few hours before this workflow's
      # schedule, so every scheduled run got a FRESH image. The post-SwitchTraffic
      # "new-tablet-not-serving" window (roadmap 72(b)) is sensitive to that
      # image's vttablet/vtgate healthcheck timing.
      #
      # On 2026-09-20 a fresh image took out TWO of the four exactly-once oracles
      # — StreamerFollowsReshardEndToEnd and ChaosExactlyOnce — both green on
      # 09-06 and 09-13. That also falsified the premise the
      # RelaxSkewReshardMidStream quarantine was scoped on ("the no-toxiproxy
      # sibling passes in the same run"). Measured, not inferred: the green 09-13
      # run (34761999726) pulled sha256:9270ca63… and the red 09-20 run
      # (35515339149) pulled sha256:4310886e…
      #
      # The digest below is the one that was GREEN on 2026-09-13. The retry budget
      # was deliberately NOT raised: roadmap 72(b) says in as many words, do NOT
      # inflate the retry budget to chase the image window.
      #
      # ci-ghcr-pull.sh, NOT ci-mirror-pull.sh --mirror: the mirror helper falls
      # back to a docker.io pull of the STOCK ref on a miss with only a
      # ::warning, which for a pin is silent RE-FLOATING — the leg would quietly
      # go back to upstream vitess/lite:latest, the exact coupling this pin
      # removes. ci-ghcr-pull.sh retries and then fails loudly.
      #
      # Fresh-image coverage is not lost: vitess-version-matrix.yml is what sweeps
      # versions. This leg's job is sluice's reshard correctness, which wants a
      # fixed substrate. Lift the pin when the image's healthcheck-settling window
      # is fixed, together with the RelaxSkewReshardMidStream quarantine.
      - name: Pull the PINNED Vitess image and retag as vitess/lite:latest
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PINNED='ghcr.io/sluicesync/sluice-vitess@sha256:9270ca630ad44457ae745c1031cf6232667bdebdac06da2d7c407b022374ad7e'
          bash scripts/ci-ghcr-pull.sh "$PINNED"
          docker tag "$PINNED" vitess/lite:latest

      - name: Run the reshard suite
        run: |
          # 9 selected, 4 PASS — 5 are quarantined t.Skip()s: the 4 RelaxSkew
          # A/B *skew* tests (skipReshardSkewABQuarantine — drained-shard
          # incompatible with the non-default MinimizeSkew harness) PLUS
          # TestVitessReshard_RelaxSkewReshardMidStream. The roadmap item 72(b)
          # sluice-side fix IS landed and unit-pinned (classifyReaderError
          # retriable carve-out for the transient post-SwitchTraffic "tablet is
          # either down or nonexistent" NotFound + reshard-reopen PRIMARY-pin), so
          # a REAL reshard reconnects through the window. But this STRESS test
          # stays quarantined for an INFRA reason: the freshly-prebaked
          # sluice-vitess:latest widened the NEW PRIMARY's healthcheck-settling
          # window to >24s, past any sane retry budget (see the test's skip note +
          # roadmap 72(b)). Un-quarantine when the image window is fixed.
          # The 4 that PASS are the exactly-once oracles: ProofOfReshardability,
          # ChaosExactlyOnce, StreamerFollowsReshardEndToEnd, ShardedColdCopy.
          bash scripts/check-leg-nonvacuity.sh \
            'integration vitessreshard' '^TestVitessReshard_' ./internal/engines/mysql/... 9 4 \
            -race -timeout=95m

  # The NOBLOB partial-row-image belt suite (item-74 / ADR-0172): boots the
  # full cluster with binlog_row_image=NOBLOB written into each tablet's
  # mysqld (testdata/vitesscluster/docker-compose.noblob.yml), so an
  # unchanged BLOB/TEXT column genuinely drops out of an UPDATE after-image
  # on the wire — the silent-loss trap the belt refuses. It covers BOTH
  # dispatch paths (warm-resume dispatchRow + cold-start dispatchCDCRow, the
  # v0.99.273 fix path) and asserts up front that @@global.binlog_row_image =
  # NOBLOB on both tablet mysqlds (the non-vacuity guard: a FULL-reverting
  # provisioning regression fails LOUD instead of passing vacuously green).
  #
  # These tests carry the plain `vitesscluster` tag and match the
  # `TestVitessCluster` prefix (the single-exclusion run-filter-coverage
  # guard requires every non-chaos vitesscluster test to; a dedicated
  # `noblob` sub-tag would need a second axis exclusion the guard doesn't
  # support). They therefore ALSO ride the weekly vitess-version-matrix
  # `cluster` leg on v23+/latest (skipping on legacy-flag v21/v22); this leg
  # is the focused, dispatchable, default-v24 regression home matching the
  # chaos/reshard shape. -race because the CDC pump is goroutine-bearing.
  noblob:
    name: Vitess NOBLOB belt suite
    if: ${{ github.event_name == 'schedule' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'noblob' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      # Same GHCR-mirror pull as the chaos leg: the harness drives
      # `docker compose` directly (not testcontainers), so the image must be
      # in the local cache and VITESS_LITE_IMAGE must point the compose file
      # + harness at the mirror (no docker.io rate-limit SPOF).
      - name: Log in to ghcr.io + pull the pre-baked Vitess image
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-ghcr-pull.sh ghcr.io/sluicesync/sluice-vitess:v24.0.1

      - name: Run the NOBLOB belt suite
        env:
          VITESS_LITE_IMAGE: ghcr.io/sluicesync/sluice-vitess:v24.0.1
        run: |
          bash scripts/check-leg-nonvacuity.sh \
            'integration vitesscluster' '^TestVitessClusterNoBlob_' ./internal/engines/mysql/... 2 2 \
            -race -timeout=40m

  # The PIPELINE-package vstream suite (Bug-132 chunked parity,
  # restart-mid-copy chaos, sharded-source + Bug-152 collision
  # preflight, write-concurrency, ShapeA consolidation, F7c VStream
  # schema-forward). The required `Integration (vstream)` check in
  # ci.yml runs only the mysql-engine package with -run 'TestVStream_',
  # so these matched neither its package set nor its filter and ran
  # nowhere until this leg existed. They live here (not in the required
  # check) because the set includes a restart-chaos test — observe its
  # reliability across a few weekly cycles before considering promotion
  # into ci.yml's vstream job.
  #
  # The -run filter's third alternative, ^TestStreamer_.*VStream, exists
  # because the F7c schema-forward pin drives the full Streamer apply
  # loop — it is streamer-shaped, not migrate-shaped, so it keeps the
  # pipeline package's TestStreamer_ naming convention rather than
  # taking a misleading TestMigrate_VStream prefix. The fourth alternative,
  # ^TestVindex, is the audit-2026-07-19 M2-2 vindex-move-OUT ground-truth pin
  # (a sharded-VStream premise check, neither migrate- nor streamer- nor
  # spike-shaped). Any pipeline vstream test must match one of these
  # alternatives or it silently never runs (enforced by
  # scripts/check-run-filter-coverage.sh in ci.yml's Lint job; keep that
  # script's manifest in sync with this filter).
  vstream-pipeline:
    name: Pipeline vstream suite
    if: ${{ github.event_name == 'schedule' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'vstream-pipeline' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # The -run alternation, defined ONCE so the budget guard below and
      # the run step can never drift apart.
      VSTREAM_PIPELINE_RUN: '^(TestMigrate_VStream|TestStreamer_.*VStream|TestSpikeShapeA_|TestVindex)'
      # The 44m -timeout / 50m job budget's documented basis (audit
      # 2026-07-23 TEST-9): sized for exactly this many matching
      # top-level tests. The guard below fails on ANY drift — fewer
      # means a rename/removal silently emptied part of the filter
      # (the vacuous-green shape); more means a new cluster-boot test
      # joined the leg, so RE-DERIVE the budget (and this count) in the
      # same PR instead of letting the 19c J-TEST-3 compounding
      # continue.
      VSTREAM_PIPELINE_EXPECTED_TESTS: "15"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      # TEST-9 (audit 2026-07-23): `go test` exits 0 when -run matches
      # nothing, so a rename could silently empty (part of) the
      # alternation and this leg would green on a shrinking suite while
      # its budget quietly covered fewer and fewer cluster boots — the
      # filtered-tag-gate's F1 vacuous-green class. Pin the match count
      # to the documented budget basis BEFORE spending any container
      # time.
      - name: Assert the -run filter matches the documented suite (vacuous-green + budget-basis guard)
        run: |
          matched=$(go test -tags='integration vstream' -list "$VSTREAM_PIPELINE_RUN" ./internal/pipeline/ | grep -c '^Test' || true)
          if [ "$matched" -ne "$VSTREAM_PIPELINE_EXPECTED_TESTS" ]; then
            echo "::error::vstream-pipeline: -run filter matches ${matched} tests, budget basis is ${VSTREAM_PIPELINE_EXPECTED_TESTS}. Fewer = a rename/removal silently emptied part of the filter; more = a new cluster-boot test joined the leg. Re-derive the 44m/50m budget AND update VSTREAM_PIPELINE_EXPECTED_TESTS in the same PR."
            go test -tags='integration vstream' -list "$VSTREAM_PIPELINE_RUN" ./internal/pipeline/
            exit 1
          fi

      - name: Log in to ghcr.io + pre-pull images (bounded retry)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci-ghcr-pull.sh \
            ghcr.io/sluicesync/sluice-mysql:8.0-prebaked \
            ghcr.io/sluicesync/sluice-postgres:16-prebaked \
            ghcr.io/sluicesync/sluice-postgis:16-3.4-prebaked
      # Via the GHCR mirror with docker.io fallback (task #36) — even
      # bounded-retry docker.io pulls have red-failed jobs on transient
      # "context deadline exceeded" (see the ci.yml vstream job note).
      # The helper retags the mirror back to the stock name locally.
      - name: Pre-pull vttestserver via its GHCR mirror (docker.io fallback)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-mirror-pull.sh vitess/vttestserver:mysql80

      - name: Run the pipeline vstream tests
        run: |
          set -o pipefail
          go test -tags='integration vstream' -race -count=1 -timeout=44m \
            -run "$VSTREAM_PIPELINE_RUN" -v ./internal/pipeline/ 2>&1 | tee vstream-pipeline.out
          # Second half of the TEST-9 guard, mirroring the filtered-tag-
          # gate's per-test PASS assert: every matched test must have
          # actually run AND passed at top level — a t.Skip (e.g. a
          # provider-health skip after a mid-run Docker death) greens
          # `go test` while executing nothing.
          passed=$(grep -c '^--- PASS: Test' vstream-pipeline.out || true)
          if [ "$passed" -ne "$VSTREAM_PIPELINE_EXPECTED_TESTS" ]; then
            echo "::error::vstream-pipeline: ${passed} top-level tests PASSed, expected ${VSTREAM_PIPELINE_EXPECTED_TESTS} — a test was skipped or didn't run (vacuous green). See the run log."
            exit 1
          fi

  # The real-world-schema corpus (roadmap item 52): migrate popular OSS
  # app schemas (GitLab / WordPress / Joomla / MediaWiki / Chinook /
  # Employees / Vitess) through sluice on the deliberate weekly cadence
  # the item intends. The corpus tests ALSO compile in the per-PR
  # pipeline-migrate shard, but the *.sql dumps are fetch-on-demand
  # (gitignored), so there they SKIP — this leg is where they actually
  # run: it fetches the corpus first, then executes it. That includes
  # the item-51 restore-parity oracle over the corpus schemas
  # (TestMigrate_Corpus_DumpParity_*) and the sample-row verify legs
  # (TestMigrate_Corpus_SampleVerify_*).
  #
  # -race because the migrate path the corpus drives is goroutine-bearing
  # (parallel copy); a weekly -race sweep over real schemas is cheap
  # insurance. Non-required (a red run files a bug, never blocks a merge)
  # — the corpus deliberately includes characterization legs (GitLab at
  # 1444 tables) that log rather than hard-assert, and fetch.sh reaches
  # upstream over the network, so a transient fetch flake must not gate
  # merges.
  #
  # The -run filter is scoped by the shared TestMigrate_Corpus_ prefix.
  # These carry only the `integration` tag (no dedicated axis tag), so
  # they are NOT covered by scripts/check-run-filter-coverage.sh — keep
  # every corpus test named TestMigrate_Corpus_* so this filter finds it.
  corpus:
    name: Real-world corpus suite
    if: ${{ github.event_name == 'schedule' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'corpus' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      - name: Log in to ghcr.io + pre-pull DB images (bounded retry)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/ci-ghcr-pull.sh \
            ghcr.io/sluicesync/sluice-mysql:8.0-prebaked \
            ghcr.io/sluicesync/sluice-postgres:16-prebaked

      # Fetch the corpus dumps (schema-only, data-stripped; gitignored /
      # fetch-on-demand). Provenance + rebuild recipe live in
      # internal/pipeline/testdata/real-world-corpus/{MANIFEST.md,fetch.sh}.
      - name: Fetch the real-world corpus
        run: bash internal/pipeline/testdata/real-world-corpus/fetch.sh

      - name: Run the corpus suite
        run: |
          # 23 selected, 17 PASS — the 6 TestMigrate_Corpus_*_Congruence_*
          # subtests are unconditional t.Skips: the upstream-pair congruence
          # oracle was RETIRED (65d93b63) because the pairs diverge by
          # authoring convention not sluice error, a committed golden is
          # licensing-blocked (Apache vs GPL), and cross-engine translation
          # is already covered by migrate_cross_integration_test.go + the
          # DumpParity corpus. Rationale lives in
          # migrate_realworld_corpus_congruence_integration_test.go's file
          # doc. The DBs themselves still run in the migrate/DryRun +
          # DumpParity legs (the 17 that PASS).
          bash scripts/check-leg-nonvacuity.sh \
            'integration' '^TestMigrate_Corpus_' ./internal/pipeline/ 23 17 \
            -race -timeout=40m

  # The AWS-KMS envelope-encryption suite (audit N-17c):
  # backup/restore against a real localstack KMS container + real PG —
  # round-trip (ciphertext chunks, manifest KEK metadata, restore via a
  # fresh kms.Decrypt), chain extension (full + incremental under the
  # same key), and the wrong-key / missing-key loud refusals. Weekly +
  # dispatch: the KMS path only otherwise has unit pins against a
  # stubbed SDK (internal/crypto/aws_kms_test.go), so this is the one
  # place a real Encrypt/Decrypt wire round-trip runs.
  #
  # Any kmsverify-tagged test MUST carry the TestBackup_KMS
  # prefix or the -run filter below silently skips it (enforced by
  # scripts/check-run-filter-coverage.sh in ci.yml's Lint job; keep
  # that script's manifest in sync with this filter).
  kmsverify:
    name: KMS localstack suite
    if: ${{ github.event_name == 'schedule' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'kmsverify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      - name: Log in to ghcr.io + pre-pull the PG image (bounded retry)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-ghcr-pull.sh ghcr.io/sluicesync/sluice-postgres:16-prebaked

      # localstack has no GHCR mirror (yet); pull docker.io directly
      # with a small bounded retry so a transient registry blip doesn't
      # red the leg. Keep the tag in sync with localstackImage in
      # internal/pipeline/backup_kms_localstack_integration_test.go.
      - name: Pre-pull localstack (bounded retry)
        run: |
          for i in 1 2 3; do
            docker pull localstack/localstack:4.0 && break
            echo "pull attempt $i failed; retrying in $((i * 10))s"
            sleep $((i * 10))
          done

      - name: Run the KMS localstack suite
        run: |
          # 6 selected, 5 PASS — the 6th (TestBackup_KMSEncryption_AccessDenied)
          # is an unconditional t.Skip: localstack community edition does not
          # enforce IAM, so the AccessDenied translation branch is unit-pinned
          # in internal/crypto/aws_kms_test.go instead (see the leg header). A
          # provider-health skip on any of the other 5 (the failure mode this
          # guard exists to catch) drops the PASS count below 5 and fails loud.
          bash scripts/check-leg-nonvacuity.sh \
            'integration kmsverify' '^TestBackup_KMS' ./internal/pipeline/ 6 5 \
            -race -timeout=25m

  # The CROSS-VERSION backup-compatibility gate (roadmap item 90 / Bug 212,
  # and item 104 / Bug 216). Builds three released binaries from source in
  # throwaway tag worktrees, builds the working tree, and runs them against
  # encrypted backup chains on real Postgres: forward read, backward
  # refusal, the Bug-212 extend-an-older-chain cell, an OLD-only control
  # that proves the Bug-212 cell's failure comes from the version raise and
  # not the harness, the epoch-partition cell, and — the one whose failure
  # is a BUG rather than a documented consequence — cell 6, where the
  # working tree writes a primary-keyed Postgres chain and the previous
  # SAME-format release must restore it. Cell 6 is the gate for the class
  # that shipped in v0.104.3 past a frozen-golden unit test, because that
  # golden compared the release against itself.
  # See internal/pipeline/backup_crossversion_integration_test.go for the
  # full contract and scripts/crossversion-build.sh for how the pair is
  # derived (never hardcoded — the script refuses rather than build two
  # copies of the same version, which would green against itself).
  #
  # No -race: the suite's own Go code is a serial driver around two child
  # processes, so -race would cover nothing here and only inflate the
  # budget — same reasoning as the ddlfixture leg below.
  #
  # Any crossversion-tagged test MUST carry the TestBackup_CrossVersion
  # prefix or the -run filter below silently skips it (enforced by
  # scripts/check-run-filter-coverage.sh in ci.yml's Lint job; keep that
  # script's manifest in sync with this filter).
  #
  # TWO suites share the leg since the FormatVersion-11 bump (audit
  # 2026-09-15 F-2): internal/pipeline's chain-compat suite and
  # internal/pipeline/backup's TestBackup_CrossVersionPositionlessFull,
  # which pins the one tier no `backup full` flag can reach — it is stamped
  # by the SHAPE of the source (a MySQL server with its binary log off), so
  # it boots its own mysql:8.0 containers rather than the PG image below.
  # THREE since the FormatVersion-12 bump (2026-09-25): internal/pipeline's
  # TestBackup_CrossVersionExactNumbers pins the exact-numbers tier, stamped
  # only on a postgres-trigger segment that carried an exact-text number.
  # Each tier suite runs against its OWN below-tier binary
  # (CROSSVER_BELOW_<NAME>_*), so the next bump does not strand them.
  # Both guards count 3 accordingly; a fourth suite bumps them again.
  crossversion:
    name: Cross-version backup compat
    if: ${{ github.event_name == 'schedule' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'crossversion' }}
    runs-on: ubuntu-latest
    # 45, not 40: the positionless-full suite adds two MySQL boots and one
    # incremental window on top of the peer axis (cell 6), which itself
    # added a fourth tag build and a sixth cell.
    timeout-minutes: 45
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene: the build script picks
      # the old binary's tag by walking `git tag --sort=-v:refname` and
      # reading BackupFormatVersion out of each tag's tree. A shallow,
      # tagless checkout would leave it with nothing to pick — it refuses
      # loudly there rather than degrading, but the fix is here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      # `go test` exits 0 when -run matches nothing, so pin the match count
      # BEFORE spending two builds and a container on it. Cheap, and it
      # compiles the tagged file without needing the binaries (the env
      # contract is read inside the test body, not at list time).
      - name: Assert the -run filter matches the suite (vacuous-green guard)
        run: |
          matched=$(go test -tags='integration crossversion' -list '^TestBackup_CrossVersion' ./internal/pipeline/ ./internal/pipeline/backup/ | grep -c '^Test' || true)
          if [ "$matched" -ne 3 ]; then
            echo "::error::crossversion: -run filter matches ${matched} top-level tests, expected 3 (chain-compat + positionless-full + exact-numbers). A rename emptied the filter or a cross-version test joined/left the leg — update the filter, this guard, and scripts/check-run-filter-coverage.sh together."
            exit 1
          fi

      - name: Log in to ghcr.io + pre-pull the PG image (bounded retry)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-ghcr-pull.sh ghcr.io/sluicesync/sluice-postgres:16-prebaked

      # Emits CROSSVER_* into $GITHUB_ENV for the run step below.
      - name: Build the previous-release and working-tree binaries
        run: bash scripts/crossversion-build.sh

      - name: Run the cross-version backup-compatibility gate
        run: |
          set -o pipefail
          go test -tags='integration crossversion' -count=1 -timeout=30m \
            -run '^TestBackup_CrossVersion' -v ./internal/pipeline/ ./internal/pipeline/backup/ 2>&1 | tee crossversion.out
          # Second half of the guard, mirroring the vstream-pipeline leg: a
          # t.Skip greens `go test` while executing nothing. (Each suite's
          # cells have their OWN ledger inside the test — a cell that never
          # runs fails the parent by name — so this outer check is
          # specifically for the case where a whole suite silently didn't.)
          passed=$(grep -c '^--- PASS: TestBackup_CrossVersion' crossversion.out || true)
          if [ "$passed" -ne 3 ]; then
            echo "::error::crossversion: ${passed} top-level tests PASSed, expected 3 — a suite was skipped or didn't run (vacuous green). See the run log."
            exit 1
          fi

  # The DDL-fixture harness (internal/translate/ddl_fixture_test.go):
  # sweep the Dolt sqllogictest createtable1 corpus (~4,575 CREATE
  # TABLEs) through a real MySQL 8.0 container and sluice's schema
  # reader, asserting structural invariants per statement. DISPATCH-
  # ONLY (repo-audit 2026-07-03 T-5 gave it this CI entry point —
  # before this leg the suite was runnable but ran nowhere): it is a
  # corpus sweep for schema-reader changes, not a weekly regression
  # signal, and its ~25-30 min wall clock is all fixture grind. It IS
  # included in a dispatched `suite: all` (all means all), but the
  # `github.event_name` guard keeps it off the weekly schedule.
  #
  # No -race: the harness is a single-goroutine DDL apply/read loop,
  # and -race would roughly double an already corpus-bound half hour
  # for no concurrency coverage.
  #
  # Any ddlfixture-tagged test MUST carry the TestDDLFixture prefix or
  # the -run filter below silently skips it (enforced by
  # scripts/check-run-filter-coverage.sh in ci.yml's Lint job).
  ddlfixture:
    name: MySQL DDL-fixture corpus
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.suite == 'all' || github.event.inputs.suite == 'ddlfixture') }}
    runs-on: ubuntu-latest
    # The in-test context budget is 30m; the harness's own header asks
    # for -timeout at least 5m larger (deferred summary headroom), and
    # the outer cap stays above the inner per the usual invariant.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      # The harness boots stock mysql:8.0 via testcontainers; pre-pull
      # it through its GHCR mirror (docker.io fallback) so the boot
      # hits the local cache — same task-#36 pattern as ci.yml.
      - name: Pre-pull mysql:8.0 via its GHCR mirror (docker.io fallback)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-mirror-pull.sh mysql:8.0

      - name: Run the DDL-fixture corpus
        run: |
          bash scripts/check-leg-nonvacuity.sh \
            'integration ddlfixture' '^TestDDLFixture' ./internal/translate/... 1 1 \
            -timeout=40m

  # TESTCI-1's scheduled-red consumer was GENERALIZED out of this file
  # (audit H-5, 2026-08-15): it now lives in report-red.yml as a
  # `workflow_run` consumer covering EVERY scheduled correctness
  # workflow, not just this one, and closes its standing issue on the
  # next green run. The reusable consumer restores this job's per-leg
  # detail generically via the run's jobs API. scripts/check-schedule-
  # consumers.sh (Lint) fails CI if any scheduled workflow — this one
  # included — loses its consumer.
